<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Terminal — Scan Badge</title>
<meta name="description" content="Terminal de badgeage QR de la RSI : présentez le badge devant la caméra pour pointer votre présence." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#5A0A0A" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="/terminal/html5-qrcode.min.js"></script>
<style>
  body {
    margin: 0;
    background: linear-gradient(160deg, #5A0A0A 0%, #7B1515 55%, #3a0606 100%);
    color: white;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
  }
  #logo { width: 88px; height: 88px; object-fit: contain; margin-bottom: 6px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
  h1 { font-size: 18px; font-weight: 500; margin: 8px 0 16px; color: #F3E3B3; text-align: center; }
  #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #D4A017; }
  /* Popup de résultat : centré, à la taille de l'écran, fermé par le bouton. */
  #resultat {
    position: fixed; inset: 0; z-index: 40;
    display: none; align-items: center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: rgba(20,3,3,0.78);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    box-sizing: border-box;
  }
  #resultat.ouvert { display: flex; }
  #resultat .carte {
    width: min(94vw, 560px); max-height: 92vh; overflow-y: auto;
    box-sizing: border-box; border-radius: 22px;
    padding: clamp(18px, 4vmin, 34px);
    text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    animation: apparition 0.18s ease-out;
    display: flex; flex-direction: column; gap: clamp(10px, 2.2vmin, 18px);
  }
  @keyframes apparition { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .succes .carte { background: #eaf3de; color: #1f4207; border-top: 10px solid #3b7d12; }
  .visiteur .carte { background: #fdf0cf; color: #4d3400; border-top: 10px solid #D4A017; }
  .erreur .carte { background: #fde2e2; color: #6e1616; border-top: 10px solid #b42318; }
  #resultat .icone {
    width: clamp(56px, 13vmin, 92px); height: clamp(56px, 13vmin, 92px); margin: 0 auto;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(30px, 7vmin, 52px); font-weight: 800; color: #fff;
  }
  .succes .icone { background: #3b7d12; }
  .visiteur .icone { background: #b8860b; }
  .erreur .icone { background: #b42318; }
  #resultat .etat { font-size: clamp(14px, 2.6vmin, 18px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
  #resultat .qui { font-size: clamp(24px, 5.6vmin, 40px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  #resultat .message { font-size: clamp(18px, 3.6vmin, 26px); font-weight: 600; line-height: 1.3; }
  #resultat dl {
    display: grid; grid-template-columns: auto 1fr; gap: clamp(6px, 1.4vmin, 12px) 16px;
    margin: 0; text-align: left; font-size: clamp(16px, 3.1vmin, 22px);
    background: rgba(255,255,255,0.6); border-radius: 14px; padding: clamp(12px, 2.6vmin, 20px);
  }
  #resultat dt { opacity: 0.7; }
  #resultat dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  #resultat .fermer {
    border: none; border-radius: 14px; cursor: pointer; width: 100%;
    padding: clamp(14px, 3vmin, 20px); font-size: clamp(18px, 3.4vmin, 24px); font-weight: 700;
    background: #7B1515; color: #fff; box-shadow: 0 4px 0 #4a0b0b;
  }
  #resultat .fermer:active { transform: translateY(2px); box-shadow: 0 2px 0 #4a0b0b; }
  #resultat .fermer:focus-visible { outline: 4px solid #D4A017; outline-offset: 3px; }
  #lieu {
    display: none; align-items: center; gap: 6px;
    background: rgba(212,160,23,0.18); border: 1px solid rgba(212,160,23,0.6);
    color: #F3E3B3; border-radius: 999px; padding: 5px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-bottom: 4px;
  }
  #choixTemple {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(30,4,4,0.94); padding: 24px 16px; box-sizing: border-box;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  #choixTemple h2 { color: #F3E3B3; font-size: 20px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  #choixTemple p { color: #F3E3B3; opacity: 0.8; font-size: 13px; margin: 0; text-align: center; max-width: 340px; }
  #listeTemples { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  #listeTemples button, #annulerTemple {
    border-radius: 12px; border: 1px solid rgba(212,160,23,0.6); padding: 14px; font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
  }
  #listeTemples button[aria-current="true"] { background: #D4A017; color: #3a0606; }
  #annulerTemple { background: transparent; font-weight: 500; font-size: 14px; }
  #statut { font-size: 12px; color: #D4A017; margin-top: 12px; }
  #sonBtn {
    position: fixed; top: 10px; right: 10px;
    background: rgba(255,255,255,0.14); color: #F3E3B3;
    border: 1px solid #D4A017; border-radius: 999px;
    font-size: 18px; padding: 4px 12px; cursor: pointer;
    z-index: 10;
  }
  #sonBtn[data-mute="1"] { opacity: 0.55; }
  #sonBandeau {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(12,12,12,0.88); color: #F3E3B3;
    border: 1px solid #D4A017; border-radius: 999px;
    padding: 12px 20px; font-size: 15px; white-space: nowrap;
    display: none; align-items: center; gap: 8px;
    z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  #sonBandeau .boutAction {
    background: #D4A017; color: #3a0606; border: none;
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-left: 6px;
  }
</style>
</head>
<body>
  <img id="logo" src="/terminal/rsi-logo.png" alt="RSI" />
  <button id="lieu" type="button" title="Changer le temple de ce terminal">📍 <span id="lieuNom"></span></button>
  <h1>Présentez le QR code du badge devant la caméra</h1>
  <div id="reader"></div>
  <div id="resultat" role="dialog" aria-modal="true" aria-live="assertive"></div>
  <div id="statut">Initialisation de la caméra…</div>
  <button id="sonBtn" title="Couper / activer le son">🔊</button>
  <div id="choixTemple" role="dialog" aria-modal="true" aria-labelledby="choixTitre">
    <h2 id="choixTitre">Où se trouve ce terminal ?</h2>
    <p>Les badges scannés ici seront enregistrés dans ce temple. Le choix est mémorisé sur cet appareil.</p>
    <div id="listeTemples"><p>Chargement des temples…</p></div>
    <button id="annulerTemple" type="button">Annuler</button>
  </div>
  <div id="sonBandeau">🔇 Touchez l'écran pour activer le son<button class="boutAction" type="button">Activer le son</button></div>

<script data-audio-son="v2">
  const API_BASE = window.location.origin;

  let enTraitement = false;

  // ---------- Temple du terminal ----------
  // Lien d'installation : /terminal/?temple=CODE (copié depuis la page
  // « Temples » du dashboard). Le code est mémorisé sur l'appareil ; sans
  // code, le terminal demande son temple avant d'accepter des badges.
  const CLE_TEMPLE = "terminal-temple";
  let temples = [];
  let temple = null; // { code, nom }

  function lireTempleMemorise() {
    try { return JSON.parse(localStorage.getItem(CLE_TEMPLE) || "null"); } catch (e) { return null; }
  }
  function memoriserTemple(t) {
    temple = t;
    try { localStorage.setItem(CLE_TEMPLE, JSON.stringify(t)); } catch (e) {}
    afficherLieu();
  }
  function afficherLieu() {
    const el = document.getElementById("lieu");
    if (!temple) { el.style.display = "none"; return; }
    document.getElementById("lieuNom").textContent = temple.nom;
    el.style.display = "inline-flex";
  }
  function ouvrirChoixTemple() {
    const liste = document.getElementById("listeTemples");
    liste.innerHTML = "";
    if (temples.length === 0) {
      const p = document.createElement("p");
      p.textContent = "Liste des temples indisponible. Vérifiez la connexion puis rechargez la page.";
      liste.appendChild(p);
    }
    temples.forEach((t) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.nom + (t.estSiege ? " · siège" : "");
      if (temple && temple.code === t.code) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => {
        memoriserTemple({ code: t.code, nom: t.nom });
        fermerChoixTemple();
      });
      liste.appendChild(b);
    });
    document.getElementById("annulerTemple").style.display = temple ? "block" : "none";
    document.getElementById("choixTemple").style.display = "flex";
  }
  function fermerChoixTemple() {
    document.getElementById("choixTemple").style.display = "none";
  }
  document.getElementById("lieu").addEventListener("click", ouvrirChoixTemple);
  document.getElementById("annulerTemple").addEventListener("click", fermerChoixTemple);

  async function initialiserTemple() {
    const codeUrl = new URLSearchParams(location.search).get("temple");
    temple = lireTempleMemorise();
    afficherLieu();
    try {
      const rep = await fetch(API_BASE + "/api/eglises/public");
      temples = (await rep.json()).eglises || [];
    } catch (e) {
      temples = [];
    }
    const trouver = (code) => temples.find((t) => t.code.toUpperCase() === String(code || "").trim().toUpperCase());
    if (codeUrl && trouver(codeUrl)) {
      const t = trouver(codeUrl);
      memoriserTemple({ code: t.code, nom: t.nom });
      // Retire le paramètre de l'adresse : le choix vaut désormais pour l'appareil.
      history.replaceState(null, "", location.pathname);
    } else if (temple && temples.length > 0 && !trouver(temple.code)) {
      temple = null; // temple désactivé ou renommé : on redemande
      afficherLieu();
    } else if (temple && trouver(temple.code)) {
      const t = trouver(temple.code);
      memoriserTemple({ code: t.code, nom: t.nom }); // nom à jour
    }
    if (!temple) ouvrirChoixTemple();
  }
  initialiserTemple();

  // ---------- Sons du terminal ----------
  // v2 : déblocage audio UNIQUE et PERSISTANT via Web Audio. Le navigateur ne
  // considère pas un scan caméra comme un "geste utilisateur" : après le premier
  // contact, l'AudioContext reste déverrouillé et chaque badge sonne tout seul.
  const AUDIO_BASE = location.origin + "/terminal/audio/";
  const FICHIERS = {
    succes:        "succes.wav",
    deja:          "deja.wav",
    erreur:        "erreur.wav",
    annonceSucces: "annonce-succes.wav",
    annonceDeja:   "annonce-deja.wav",
    annonceInconnu:"annonce-inconnu.wav",
    annonceErreur: "annonce-erreur.wav",
  };
  const TONALITE = { succes: 0.9, deja: 0.9, erreur: 0.9, annonceSucces: 1, annonceDeja: 1, annonceInconnu: 1, annonceErreur: 1 };

  let sonCoupe = false;
  try { sonCoupe = localStorage.getItem("terminal-coupeSon") === "1"; } catch (e) {}

  const bandeauEl = document.getElementById("sonBandeau");
  let ctx = null;
  let audioDebloque = false;
  const BUFFERS = {};

  function obtenirCtx() {
    if (ctx) return ctx;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { ctx = new Ctor(); } catch (e) { return null; }
    return ctx;
  }

  // Décodage des WAV (lazy) : appelé au premier contact (voir debloquerSon).
  async function prechargerAudio() {
    const c = obtenirCtx();
    if (!c) return;
    for (const [cle, fichier] of Object.entries(FICHIERS)) {
      try {
        const rep = await fetch(AUDIO_BASE + fichier);
        const buf = await rep.arrayBuffer();
        BUFFERS[cle] = await c.decodeAudioData(buf);
      } catch (e) {}
    }
  }

  // Lecture via Web Audio : autorisée automatiquement une fois l'AudioContext
  // démarré (≈ aucune restriction d'autoplay ensuite).
  function jouerWebAudio(nom) {
    if (!BUFFERS[nom]) return Promise.resolve(false);
    const c = obtenirCtx();
    if (!c || c.state === "suspended") return Promise.resolve(false);
    try {
      const src = c.createBufferSource();
      src.buffer = BUFFERS[nom];
      const gain = c.createGain();
      gain.gain.value = TONALITE[nom] ?? 1;
      src.connect(gain);
      gain.connect(c.destination);
      src.start();
      return Promise.resolve(true);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  // Filet de sécurité si le Web Audio n'est pas disponible/encore décodé.
  function jouerViaElement(nom) {
    try {
      const a = new Audio(AUDIO_BASE + FICHIERS[nom]);
      a.preload = "auto";
      a.volume = TONALITE[nom] ?? 1;
      a.currentTime = 0;
      return a.play().then(
        () => true,
        () => false
      );
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function afficherBandeauSon() {
    if (!sonCoupe && bandeauEl) bandeauEl.style.display = "flex";
  }

  function cacherBandeauSon() {
    if (bandeauEl) bandeauEl.style.display = "none";
  }

  // À appeler sur n'importe quel contact : démarre l'AudioContext UNE fois.
  // Tous les badges suivants joueront automatiquement, sans retoucher l'écran.
  // Les WAV ne sont chargés qu'à ce moment-là → la page (re)charge vite.
  let audioCharge = false;
  function debloquerSon() {
    cacherBandeauSon();
    if (sonCoupe || audioDebloque) return;
    audioDebloque = true;
    if (!audioCharge) {
      audioCharge = true;
      prechargerAudio();
    }
    const c = obtenirCtx();
    if (c && c.state !== "running" && c.resume) {
      c.resume().then(() => jouerSon("succes", 0)).catch((e) => {});
    } else {
      jouerSon("succes", 0);
    }
  }

  function jouerSon(nom, delai = 0) {
    if (sonCoupe) return;
    // démarre le contexte si nécessaire (moins de latence au premier son).
    obtenirCtx();
    setTimeout(async () => {
      let ok = await jouerWebAudio(nom);
      if (!ok) ok = await jouerViaElement(nom);
      if (!ok) afficherBandeauSon();
    }, delai);
  }

  // ---------- Popup de résultat ----------
  // Chaque scan ouvre un popup centré ; aucun autre badge n'est accepté tant
  // qu'il n'est pas fermé (bouton « Fermer », touche Entrée ou Échap).
  let popupOuvert = false;
  let dernierMatricule = null;
  let fermeLe = 0;

  function element(tag, classe, texte) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = texte;
    return e;
  }

  function ouvrirPopup(classe, icone, etat, contenu) {
    const el = document.getElementById("resultat");
    el.textContent = "";
    el.className = classe + " ouvert";
    const carte = element("div", "carte");
    carte.append(element("div", "icone", icone), element("div", "etat", etat), ...contenu);
    const bouton = element("button", "fermer", "Fermer · scan suivant");
    bouton.type = "button";
    bouton.addEventListener("click", fermerPopup);
    carte.appendChild(bouton);
    el.appendChild(carte);
    popupOuvert = true;
    document.getElementById("statut").textContent = "Fermez le popup pour scanner le badge suivant.";
    setTimeout(() => bouton.focus({ preventScroll: true }), 50);
  }

  function fermerPopup() {
    if (!popupOuvert) return;
    const el = document.getElementById("resultat");
    el.className = "";
    el.textContent = "";
    popupOuvert = false;
    fermeLe = Date.now();
    enTraitement = false;
    document.getElementById("statut").textContent = "Prêt pour le prochain scan…";
  }

  document.addEventListener("keydown", (e) => {
    if (popupOuvert && (e.key === "Enter" || e.key === "Escape")) { e.preventDefault(); fermerPopup(); }
  });

  function afficherResultat(texte, succes, etat) {
    ouvrirPopup(succes ? "succes" : "erreur", succes ? "✓" : "!", etat || (succes ? "Succès" : "Badge refusé"), [
      element("div", "message", texte),
    ]);
  }

  // Badgeage réussi : qui, matricule, temple, départements, heure.
  function afficherPointage(data) {
    const o = data.ouvrier;
    const qui = element("div", "qui", `${o.prenom} ${o.nom}`);
    const dl = document.createElement("dl");
    const heure = new Date(data.heure || Date.now()).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const departements = (o.departements && o.departements.length ? o.departements.join(", ") : o.departement) || "—";
    [
      ["Matricule", o.matricule],
      ["Temple", o.eglise ? o.eglise.nom + (o.eglise.estSiege ? " (siège)" : "") : "—"],
      ["Départements", departements],
      ["Heure", heure],
    ].forEach(([cle, valeur]) => {
      const dt = document.createElement("dt");
      dt.textContent = cle;
      const dd = document.createElement("dd");
      dd.textContent = valeur;
      dl.append(dt, dd);
    });
    ouvrirPopup(
      data.visiteur ? "visiteur" : "succes",
      "✓",
      data.visiteur ? `Présence enregistrée · visiteur à ${(data.lieu && data.lieu.nom) || (temple && temple.nom) || "ce temple"}` : "Présence enregistrée",
      [qui, dl]
    );
  }

  async function envoyerScan(matricule) {
    if (enTraitement || popupOuvert) return;
    // Le badge qu'on vient de fermer est souvent encore devant la caméra.
    if (matricule === dernierMatricule && Date.now() - fermeLe < 3000) return;
    if (!temple) { ouvrirChoixTemple(); return; }
    enTraitement = true;
    dernierMatricule = matricule;
    document.getElementById("statut").textContent = "Envoi du badge " + matricule + "…";
    try {
      const res = await fetch(API_BASE + "/api/badgeage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ matricule, temple: temple.code }),
      });
      const data = await res.json();
      if (data.ok) {
        afficherPointage(data);
        jouerSon("succes");
        jouerSon("annonceSucces", 300);
      } else if (data.code === "DEJA_BADGE_AUJOURDHUI") {
        afficherResultat(data.message || data.code, false, "Déjà badgé aujourd'hui");
        jouerSon("deja");
        jouerSon("annonceDeja", 600);
      } else if (data.code === "TEMPLE_INCONNU") {
        afficherResultat(data.message, false, "Temple inconnu");
        fermerPopup(); // le choix du temple s'ouvre à la place
        jouerSon("erreur");
        temple = null;
        afficherLieu();
        ouvrirChoixTemple();
      } else if (data.code === "BADGE_INCONNU") {
        afficherResultat("Ce badge ne correspond à aucun ouvrier.", false, "Ouvrier inconnu");
        jouerSon("erreur");
        jouerSon("annonceInconnu", 150);
      } else {
        afficherResultat(data.message || data.code, false);
        jouerSon("erreur");
        jouerSon("annonceErreur", 150);
      }
    } catch (e) {
      afficherResultat("Impossible de contacter le serveur : " + e.message, false, "Erreur réseau");
      jouerSon("erreur");
      jouerSon("annonceErreur", 150);
    } finally {
      // Popup ouvert : le scan suivant attend sa fermeture (fermerPopup).
      if (!popupOuvert) {
        document.getElementById("statut").textContent = "Prêt pour le prochain scan…";
        enTraitement = false;
      }
    }
  }

  const scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (texteDecode) => envoyerScan(texteDecode.trim()),
    () => {}
  ).then(() => {
    document.getElementById("statut").textContent = "Caméra prête.";
  }).catch((err) => {
    document.getElementById("statut").textContent = "Erreur caméra : " + err;
  });

  // Déblocage AU PREMIER contact uniquement (tactile, clavier ou souris).
  // Une fois déverrouillé, chaque badge joue automatiquement sa voix.
  const EVENEMENTS_DECLENCHEURS = ["pointerdown", "touchstart", "touchend", "keydown", "click"];
  EVENEMENTS_DECLENCHEURS.forEach((evt) =>
    window.addEventListener(evt, debloquerSon, { passive: true })
  );

  // Tente aussi un démarrage immédiat (navigateur qui garde l'autorisation entre
  // les pages, Media Engagement Index, PWA installée, etc.).
  jouerSon("succes", 0);

  // Couper / activer le son.
  const sonBtn = document.getElementById("sonBtn");
  function majSonBtn() {
    sonBtn.textContent = sonCoupe ? "🔇" : "🔊";
    sonBtn.dataset.mute = sonCoupe ? "1" : "0";
  }
  sonBtn.addEventListener("click", () => {
    sonCoupe = !sonCoupe;
    try { localStorage.setItem("terminal-coupeSon", sonCoupe ? "1" : "0"); } catch (e) {}
    if (!sonCoupe) {
      debloquerSon();
      jouerSon("succes"); // retour sonore immédiat quand on réactive
    }
    majSonBtn();
    cacherBandeauSon();
  });
  majSonBtn();

  // Le bouton du bandeau active aussi le son.
  const boutBandeau = bandeauEl && bandeauEl.querySelector(".boutAction");
  if (boutBandeau) boutBandeau.addEventListener("click", (e) => {
    e.stopPropagation();
    debloquerSon();
  });
</script>
</body>
</html>
